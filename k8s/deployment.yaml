
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booknest
  namespace: booknest
  labels:
    app: booknest
spec:
  replicas: 2
  selector:
    matchLabels:
      app: booknest
  template:
    metadata:
      labels:
        app: booknest
    spec:
      containers:
        - name: booknest
          image: ghcr.io/prathameshpp-007/booknest-app:de4331cf5815e13ee653284c9aa02dfb5a87de01
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "1.0.0"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
