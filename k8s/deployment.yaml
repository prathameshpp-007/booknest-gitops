apiVersion: apps/v1
kind: Deployment
metadata:
  name: booknest
  labels:
    app: booknest
spec:
  replicas: 2
  selector:
    matchLabels:
      app: booknest
  template:
    metadata:
      labels:
        app: booknest
    spec:
      containers:
        - name: booknest
          image: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/booknest:INITIAL
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "1.0.0"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
